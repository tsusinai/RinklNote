<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RinklNote - 记账</title>
<script src="/js/react.min.js"></script>
<script src="/js/react-dom.min.js"></script>
<script src="/js/recharts.js"></script>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root {
  --primary: #7EC1FC; --expense: #CA3032; --income: #04A433;
  --bg: #F7F7F9; --card: #FFFFFF; --text: #1f2937; --muted: #6b7280;
  --border: #e5e7eb; --border-light: #f3f4f6; --radius: 15px; --radius-sm: 10px;
  --primary-soft: #eff6ff; --primary-hover: #f8fbff;
  --tag-web-bg: #dcfce7; --tag-web-fg: #16a34a;
  --tag-qq-bg: #dbeafe; --tag-qq-fg: #2563eb;
  --tag-app-bg: #f3f4f6; --tag-app-fg: #6b7280;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04); --shadow: 0 1px 8px rgba(0,0,0,0.06);
  --ease: cubic-bezier(.4,0,.2,1);          /* ≈ Android FastOutSlowInEasing */
  --dur-fast: 120ms; --dur-med: 220ms; --dur-slow: 320ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
input:focus, select:focus, button:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
.btn { border: none; border-radius: var(--radius-sm); padding: 10px 24px; font-weight: 500; cursor: pointer; transition: transform var(--dur-fast) var(--ease), filter var(--dur-med) var(--ease), background var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease), color var(--dur-med) var(--ease); font-size: 14px; font-family: inherit; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(126,193,252,0.4); }
.btn-primary:hover { filter: brightness(0.92); transform: translateY(-1px); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-outline.danger { border-color: var(--expense); color: var(--expense); }
.btn-outline.danger:hover { background: var(--expense); color: #fff; }
.amount { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
#app { display: flex; height: 100vh; }
#sidebar { width: 220px; background: var(--card); flex-shrink: 0; padding: 28px 0; box-shadow: 1px 0 0 var(--border-light); }
#sidebar h1 { padding: 0 24px 28px; font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: -0.3px; }
#sidebar .nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
#sidebar .nav button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); border-radius: 8px; text-align: left; width: 100%; font-family: inherit; transition: all 0.15s; }
#sidebar .nav button.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
#sidebar .nav button:hover:not(.active) { background: var(--border-light); color: var(--text); }
#content { flex: 1; overflow: auto; padding: 36px 40px; }
.page { display: none; max-width: 880px; margin: 0 auto; }
.page.active { display: block; animation: fadeIn var(--dur-slow) var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.3px; }
h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.cat-btn { padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); cursor: pointer; text-align: center; font-size: 13px; font-weight: 500; transition: transform var(--dur-fast) var(--ease), background var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease), color var(--dur-med) var(--ease); font-family: inherit; }
.cat-btn:hover { border-color: var(--primary); background: var(--primary-hover); }
.cat-btn:active { transform: scale(.97); }
.cat-btn.sel { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.toggle { display: flex; background: var(--border-light); border-radius: var(--radius-sm); padding: 3px; width: fit-content; }
.toggle button { padding: 8px 20px; border: none; background: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: transform var(--dur-fast) var(--ease), background var(--dur-med) var(--ease), color var(--dur-med) var(--ease); color: var(--muted); font-family: inherit; }
.toggle button:active { transform: scale(.95); }
.toggle button.on { color: #fff; }
.toggle button.on.exp { background: var(--expense); }
.toggle button.on.theme { background: var(--primary); }
.toggle button.on.inc { background: var(--income); }
input[type="text"], input[type="number"], input[type="password"], input[type="date"], select { width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 14px; background: var(--card); font-family: inherit; transition: border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease); }
input[type="text"]:hover, select:hover { border-color: var(--border); }
.amount-input { font-size: 48px; font-weight: 700; padding: 16px 0; border: none; border-bottom: 2px solid var(--border); border-radius: 0; background: transparent; width: 100%; }
.amount-input:focus { outline: none; border-bottom-color: var(--primary); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
.tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.tag-web { background: var(--tag-web-bg); color: var(--tag-web-fg); }
.tag-qq { background: var(--tag-qq-bg); color: var(--tag-qq-fg); }
.tag-app { background: var(--tag-app-bg); color: var(--tag-app-fg); }
.msg { padding: 8px 0; font-size: 13px; text-align: center; }
.msg.ok { color: var(--income); }
.msg.err { color: var(--expense); }
.summary-card { text-align: center; }
.summary-card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.summary-card .val { font-size: 28px; font-weight: 700; }
.loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
/* Bot settings card */
.bot-card { border-left: 3px solid var(--primary); padding: 20px 24px; }
.bot-card .section { margin-bottom: 20px; }
.bot-card .section:last-child { margin-bottom: 0; }
.bot-card .section-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
.bot-card .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.bot-card .status-dot.on { background: var(--income); box-shadow: 0 0 6px rgba(4,164,51,0.4); }
.bot-card .status-dot.off { background: var(--muted); }
.bot-card .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.bot-card .field-row label { font-size: 13px; font-weight: 500; color: var(--text); min-width: 100px; }
.bot-card .field-row input { flex: 1; padding: 8px 12px; font-size: 13px; border-radius: 8px; }
.bot-card .field-row .toggle-vis { background: none; border: none; cursor: pointer; padding: 4px 8px; font-size: 16px; color: var(--muted); border-radius: 6px; }
.bot-card .field-row .toggle-vis:hover { background: var(--border-light); color: var(--text); }
.bot-card .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.bot-card details { margin-top: 16px; }
.bot-card details summary { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; }
.bot-card details ol { padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.9; }
/* Budget progress bar */
.budget-bar { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; margin: 10px 0; }
.budget-bar > div { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
.budget-bar.over > div { background: var(--expense); }
.budget-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* Recharts theme tokens (container adapts via --card/--border) */
.recharts-text, .recharts-cartesian-axis-tick text { fill: var(--muted); }
.recharts-default-tooltip { background: var(--card) !important; border: 1px solid var(--border) !important; }
.recharts-default-tooltip .recharts-tooltip-label { color: var(--muted); }
.recharts-surface { background: transparent; }

/* Dark mode — mirrors Android DarkColorScheme (#1A1A1E bg / #252528 surface).
   System default applies unless an explicit theme override is set. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1E; --card: #252528; --text: #EAEAEA; --muted: #AAAAAA;
    --border: #333333; --border-light: #2D2D30;
    --primary-soft: rgba(126,193,252,.14); --primary-hover: rgba(126,193,252,.08);
    --tag-web-bg: #0f2e1c; --tag-web-fg: #4ade80;
    --tag-qq-bg: #12294a; --tag-qq-fg: #60a5fa;
    --tag-app-bg: #2D2D30; --tag-app-fg: #AAAAAA;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.4); --shadow: 0 1px 8px rgba(0,0,0,.45);
  }
}

/* Manual theme override — attribute wins over the system media query */
:root[data-theme="dark"] {
  --bg: #1A1A1E; --card: #252528; --text: #EAEAEA; --muted: #AAAAAA;
  --border: #333333; --border-light: #2D2D30;
  --primary-soft: rgba(126,193,252,.14); --primary-hover: rgba(126,193,252,.08);
  --tag-web-bg: #0f2e1c; --tag-web-fg: #4ade80;
  --tag-qq-bg: #12294a; --tag-qq-fg: #60a5fa;
  --tag-app-bg: #2D2D30; --tag-app-fg: #AAAAAA;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4); --shadow: 0 1px 8px rgba(0,0,0,.45);
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar"><h1>RinklNote</h1><div class="nav"></div></div>
  <div id="content"></div>
</div>

<script>
// ── State ──
const API = '';
const _chartRoots = {};
const S = { tab: 'add', user: null, token: localStorage.getItem('rkl_token'),
  bills: [], cats: [], accts: [], keywords: [], msg: '', loading: false,
  // add form
  billType: 'EXPENSE', amount: '', catId: '', subCatName: '', acctId: '', remark: '',
  // bills filter
  bf: { search: '', cat: '', from: '', to: '' },
  // settings
  phone: '', pwd: '', qq: '', smode: 'login', bindCode: '',
  botConfigured: false, botBound: false, botOpenid: '', botMaskedId: '',
  botAppId: '', botSecret: '', botShowSecret: false,
  lastSync: 0, me: null, theme: localStorage.getItem('rkl_theme') || 'system',
};

const TABS = [
  { id:'add', label:'记账', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>' },
  { id:'bills', label:'账单', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/></svg>' },
  { id:'charts', label:'图表', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>' },
  { id:'assets', label:'资产', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/></svg>' },
  { id:'me', label:'我的', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>' },
  { id:'settings', label:'设置', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>' },
];

// ── API ──
async function api(path, opts={}) {
  const h = { 'Content-Type':'application/json', ...opts.headers };
  if (S.token) h['Authorization'] = 'Bearer ' + S.token;
  const r = await fetch(API + path, { ...opts, headers: h });
  return r.json();
}

// ── Render ──
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) Object.entries(props).forEach(([k,v]) => {
    if (k === 'className') el.className = v;
    else if (k === 'selected' || k === 'checked' || k === 'disabled') el[k] = v;
    else if (k.startsWith('on')) el[k.toLowerCase()] = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c != null) el.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

function msgClass() {
  if (!S.msg) return 'msg';
  return /失败|错误|不能为空|已注册|不存在/.test(S.msg) ? 'msg err' : 'msg ok';
}

// Apply the manual theme (light/dark) or fall back to the OS via prefers-color-scheme
function applyTheme() {
  const t = S.theme;
  if (t === 'light') document.documentElement.dataset.theme = 'light';
  else if (t === 'dark') document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
}

function render() {
  const sidebar = document.querySelector('#sidebar .nav');
  sidebar.innerHTML = '';
  TABS.forEach(t => {
    const btn = h('button', { className: S.tab === t.id ? 'active' : '', onClick: () => { S.tab = t.id; render(); } });
    btn.innerHTML = t.icon;
    btn.append(' ' + t.label);
    sidebar.appendChild(btn);
  });

  const content = document.getElementById('content');
  content.innerHTML = '';
  const pg = document.createElement('div'); pg.className = 'page active';

  if (!S.token && S.tab !== 'settings' && S.tab !== 'me') {
    pg.append(h('h2', null, '请先登录'), renderLogin(true));
  } else {
    if (S.tab === 'add') renderAdd(pg);
    else if (S.tab === 'bills') renderBills(pg);
    else if (S.tab === 'charts') renderCharts(pg);
    else if (S.tab === 'assets') renderAssets(pg);
    else if (S.tab === 'me') renderMe(pg);
    else if (S.tab === 'settings') renderSettings(pg);
  }
  content.appendChild(pg);

  if (S.tab === 'charts') setTimeout(drawCharts, 100);
}

// ── Login ──
function renderLogin(prompt) {
  if (!prompt) return null;
  const div = document.createElement('div');
  const tog = h('div', { className: 'toggle', style:'margin-bottom:16px' });
  ['login','register'].forEach(m => {
    tog.appendChild(h('button', {
      className: S.smode===m?'on exp':'',
      onclick: () => { S.smode = m; S.msg = ''; render(); }
    }, m==='login'?'登录':'注册'));
  });
  div.appendChild(tog);
  div.append(h('input', { type:'text', placeholder:'手机号', value:S.phone, oninput:e=>S.phone=e.target.value, style:'margin-bottom:12px' }));
  div.append(h('input', { type:'password', placeholder:'密码', value:S.pwd, oninput:e=>S.pwd=e.target.value, style:'margin-bottom:12px' }));
  div.append(h('button', { className: 'btn btn-primary', style:'width:100%', onclick: async () => {
    const path = S.smode==='login'?'/api/auth/login':'/api/auth/register';
    const r = await api(path,{method:'POST',body:JSON.stringify({phone:S.phone,password:S.pwd})});
    if (r.token) { S.token = r.token; localStorage.setItem('rkl_token', r.token); S.msg = '登录成功!'; await loadData(); }
    else { S.msg = r.message || '登录失败'; render(); }
  }}, S.smode==='login'?'登录':'注册'));
  if (S.msg) div.append(h('p',{className:msgClass()},S.msg));
  return div;
}

// ── Add Bill ──
function renderAdd(pg) {
  pg.append(h('h2', null, '快速记账'));

  // toggle
  const tog = h('div', { className: 'toggle' });
  ['EXPENSE','INCOME'].forEach(t => {
    const b = h('button', {
      className: (S.billType===t?'on '+(t==='EXPENSE'?'exp':'inc'):''),
      onClick: () => { S.billType = t; S.catId = ''; S.subCatName = ''; render(); }
    }, t==='EXPENSE'?'支出':'收入');
    tog.appendChild(b);
  });
  pg.appendChild(tog);

  // amount
  pg.append(h('input', { type: 'number', step: '0.01', placeholder: '0.00', className: 'amount-input amount',
    value: S.amount, oninput: e => { S.amount = e.target.value; S.msg = ''; } }));

  // categories
  pg.append(h('p', { style: 'fontSize:13px;color:var(--muted);margin:16px 0 8px' }, '分类'));
  const catsForType = S.cats.filter(c => c.billType === S.billType);
  if (catsForType.length === 0) {
    pg.append(h('p', { className: 'loading', style: 'padding:20px 0;font-size:14px' },
      S.token ? '暂无分类数据，请检查网络连接后刷新页面' : '请先登录以加载分类数据'));
  } else {
    const cg = h('div', { className: 'grid-4' });
    catsForType.forEach(c => {
      const b = h('button', {
        className: 'cat-btn' + (S.catId == c.id ? ' sel' : ''),
        onclick: () => { S.catId = c.id; S.subCatName = ''; render(); }
      }, c.name);
      cg.appendChild(b);
    });
    pg.appendChild(cg);
  }

  // subcategories
  const selCat = S.cats.find(c => c.id == S.catId);
  if (selCat && selCat.subCategories && selCat.subCategories.length > 0) {
    pg.append(h('p', { style: 'fontSize:13px;color:var(--muted);margin:16px 0 8px' }, '子分类'));
    const sg = h('div', { className: 'grid-4' });
    const allBtn = h('button', {
      className: 'cat-btn' + (!S.subCatName ? ' sel' : ''),
      onclick: () => { S.subCatName = ''; render(); }
    }, '全部');
    sg.appendChild(allBtn);
    selCat.subCategories.forEach(sc => {
      sg.appendChild(h('button', {
        className: 'cat-btn' + (S.subCatName === sc.name ? ' sel' : ''),
        onclick: () => { S.subCatName = sc.name; render(); }
      }, sc.name));
    });
    pg.appendChild(sg);
  }

  // account
  pg.append(h('p', { style: 'fontSize:13px;color:var(--muted);margin:16px 0 8px' }, '账户'));
  const sel = h('select', { onchange: e => S.acctId = e.target.value });
  sel.append(h('option', { value: '' }, '选择账户'));
  S.accts.forEach(a => { const opt = h('option', { value: a.id }, a.name); opt.selected = S.acctId == a.id; sel.appendChild(opt); });
  pg.appendChild(sel);

  // remark
  pg.append(h('input', { type: 'text', placeholder: '备注 (可选)', style: 'margin-top:16px',
    value: S.remark, oninput: e => S.remark = e.target.value }));

  // submit
  pg.append(h('button', { className: 'btn btn-primary', style: 'width:100%;margin-top:20px;padding:14px;font-size:16px',
    onclick: async () => {
      if (!S.amount || !S.catId || !S.acctId) { S.msg = '请填写完整'; render(); return; }
      const cat = S.cats.find(c => c.id == S.catId);
      try {
        const r = await api('/api/bills', { method: 'POST', body: JSON.stringify({
          amount: parseFloat(S.amount), billType: S.billType, categoryId: parseInt(S.catId),
          categoryName: cat?.name||'', subCategoryName: S.subCatName||null, accountId: parseInt(S.acctId), remark: S.remark||null
        })});
        if (r.id) { S.amount = ''; S.remark = ''; S.msg = '记账成功!'; await loadData(); }
        else { S.msg = r.message || '记账失败'; render(); }
      } catch(e) { S.msg = '网络错误'; render(); }
    }
  }, '记一笔'));

  if (S.msg) { pg.append(h('p', { className: msgClass() }, S.msg)); S.msg = ''; }
}

// ── Bills ──
function renderBills(pg) {
  pg.append(h('h2', null, '账单'));

  function filtered() {
    return S.bills.filter(b => {
      if (S.bf.search && !(b.remark||'').includes(S.bf.search) && !(b.categoryName||'').includes(S.bf.search)) return false;
      if (S.bf.cat && b.categoryName !== S.bf.cat) return false;
      if (S.bf.from && b.date < new Date(S.bf.from + 'T00:00:00').getTime()) return false;
      if (S.bf.to && b.date > new Date(S.bf.to + 'T23:59:59').getTime()) return false;
      return true;
    });
  }

  const f = filtered();

  // summary (uses filtered data)
  const exp = f.filter(b=>b.billType==='EXPENSE').reduce((s,b)=>s+b.amount,0);
  const inc = f.filter(b=>b.billType==='INCOME').reduce((s,b)=>s+b.amount,0);

  const sg = h('div', { className: 'grid-3' });
  [{l:'支出',k:'bills:exp',v:exp,fmt:v=>'-¥'+v.toFixed(2),c:'var(--expense)'},
   {l:'收入',k:'bills:inc',v:inc,fmt:v=>'¥'+v.toFixed(2),c:'var(--income)'},
   {l:'结余',k:'bills:bal',v:inc-exp,fmt:v=>'¥'+v.toFixed(2),c:inc>=exp?'var(--income)':'var(--expense)'}].forEach(s => {
    const card = h('div', { className: 'card summary-card' });
    const val = h('div', { className: 'val amount', style: 'color:'+s.c });
    card.append(h('div', { className: 'label' }, s.l), val);
    countUp(val, s.v, s.k, s.fmt);
    sg.appendChild(card);
  });
  pg.appendChild(sg);

  // filters
  const fg = h('div', { style: 'display:flex;gap:10px;margin:20px 0;flex-wrap:wrap' });
  fg.append(h('input', { type:'text', placeholder:'搜索...', value:S.bf.search, oninput:e=>{S.bf.search=e.target.value;render();}, style:'width:160px' }));
  const cs = h('select', { onchange:e=>{S.bf.cat=e.target.value;render();} });
  cs.append(h('option',{value:''},'全部分类'));
  [...new Set(S.bills.map(b=>b.categoryName))].forEach(c => cs.append(h('option',{value:c},c)));
  fg.appendChild(cs);
  fg.append(h('input',{type:'date',value:S.bf.from,onchange:e=>{S.bf.from=e.target.value;render();}}));
  fg.append(h('span',{style:'align-self:center;color:var(--muted)'},'至'));
  fg.append(h('input',{type:'date',value:S.bf.to,onchange:e=>{S.bf.to=e.target.value;render();}}));

  // export
  const expBtn = h('button',{className:'btn btn-outline',style:'margin-left:auto',onclick:()=>{
    const rows = [['日期','类型','分类','子分类','金额','备注','来源'], ...filtered().map(b=>[fmtDate(b.date),b.billType==='EXPENSE'?'支出':'收入',b.categoryName,b.subCategoryName||'',b.amount,b.remark||'',b.source])];
    const csv = '\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv])); a.download='rinklnote.csv'; a.click();
  }}, '导出CSV');
  fg.appendChild(expBtn);
  pg.appendChild(fg);
  if (f.length === 0) {
    const hasFilters = S.bf.search || S.bf.cat || S.bf.from || S.bf.to;
    pg.append(h('p',{className:'loading'}, hasFilters ? '未找到匹配的账单，请调整筛选条件' : '暂无账单记录，记一笔开始吧'));
    return;
  }

  const tbl = h('table');
  const thead = h('thead');
  ['日期','分类','子分类','金额','备注','来源'].forEach(l => thead.append(h('th',null,l)));
  tbl.appendChild(thead);
  const tbody = h('tbody');
  f.forEach(b => {
    const tr = h('tr');
    tr.append(h('td',null, fmtDate(b.date)));
    const catCell = h('td',null);
    const catSpan = h('span',{style:'cursor:pointer;border-bottom:1px dashed var(--muted)',onclick:()=>{
      // Show quick category selector
      const origCat = b.categoryName;
      const sel = h('select',{style:'font-size:12px;padding:4px',onchange:async(e)=>{
        if(e.target.value && e.target.value!==origCat){
          const parts = e.target.value.split('||');
          const newCatName = parts[0];
          const newSubName = parts[1] || null;
          const displayVal = newSubName ? newCatName + ' / ' + newSubName : newCatName;
          // Record correction
          await api('/api/corrections',{method:'POST',body:JSON.stringify({
            originalText:b.remark||'',originalCategory:origCat,correctedCategory:displayVal
          })});
          // Update bill
          const newCat = S.cats.find(c => c.name === newCatName);
          await api('/api/bills/'+b.id,{method:'PUT',body:JSON.stringify({
            amount:b.amount,billType:b.billType,categoryId:(newCat?newCat.id:b.categoryId),categoryName:newCatName,subCategoryName:newSubName,
            accountId:b.accountId,remark:b.remark
          })});
          S.msg='分类更新成功';await loadData();
        }
      }});
      sel.append(h('option',{value:''},'修改分类'));
      S.cats.filter(c=>c.billType===b.billType).forEach(c=>{
        sel.append(h('option',{value:c.name,selected:c.name===b.categoryName&&!b.subCategoryName},c.name));
        if (c.subCategories) c.subCategories.forEach(sc => {
          const val = c.name + '||' + sc.name;
          sel.append(h('option',{value:val,selected:c.name===b.categoryName&&sc.name===b.subCategoryName},'  └ ' + sc.name));
        });
      });
      catCell.innerHTML='';catCell.appendChild(sel);
    }}, b.categoryName);
    catCell.appendChild(catSpan);
    if (b.subCategoryName) catSpan.textContent = b.categoryName + ' / ' + b.subCategoryName;
    tr.appendChild(catCell);
    tr.append(h('td',{style:'color:var(--muted)'}, b.subCategoryName || '-'));
    tr.append(h('td',{className:'amount',style:'text-align:right;font-weight:700;color:'+(b.billType==='EXPENSE'?'var(--expense)':'var(--income)')}, (b.billType==='EXPENSE'?'-':'')+'¥'+b.amount.toFixed(2)));
    tr.append(h('td',{style:'color:var(--muted)'}, b.remark||'-'));
    const tagCls = b.source==='QQ'?'tag tag-qq':b.source==='WEB'?'tag tag-web':'tag tag-app';
    tr.append(h('td',null, h('span',{className:tagCls},b.source)));
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  pg.appendChild(tbl);

  if (S.msg) { pg.append(h('p', { className: msgClass(), style: 'margin-top:12px' }, S.msg)); S.msg = ''; }
}

  pg.append(h('h2', null, '图表分析'));

  [{k:'week',l:'本周'},{k:'month',l:'本月'},{k:'year',l:'本年'}].forEach(p => {

      className: chartPeriod===p.k?'on exp':'',
      onclick: () => { chartPeriod = p.k; render(); }
    }, p.l));
  });

  const cg = h('div', { className: 'grid-2' });
  cg.append(h('div', { className: 'card', id: 'chart-pie' }, h('h3',{style:'fontSize:14px;color:var(--muted);marginBottom:16px'},'支出分类占比')));
  cg.append(h('div', { className: 'card', id: 'chart-line' }, h('h3',{style:'fontSize:14px;color:var(--muted);marginBottom:16px'},'月度趋势')));
  pg.appendChild(cg);
  pg.append(h('div', { className: 'card', id: 'chart-bar', style: 'margin-top:20px' }, h('h3',{style:'fontSize:14px;color:var(--muted);marginBottom:16px'},'每日支出')));

function drawCharts() {
  const Re = window.Recharts;
  if (!Re) return setTimeout(drawCharts, 200);

  if (S.bills.length === 0) {
    ['chart-pie','chart-line','chart-bar'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.innerHTML = '';
        const emptyEl = document.createElement('div');
        emptyEl.style.cssText = 'text-align:center;color:var(--muted);padding:60px 20px';
        emptyEl.textContent = '暂无账单数据，记一笔后即可查看图表分析';
        el.appendChild(emptyEl);
      }
    });
    return;
  }

  // Period filter
  function inPeriod(bill) {
    const now = Date.now();
    const days = chartPeriod === 'week' ? 7 : chartPeriod === 'month' ? 30 : 365;
    return bill.date >= now - days * 86400000;
  }
  const periodBills = S.bills.filter(inPeriod);

  // Pie
  const pieMap = {};
  periodBills.filter(b=>b.billType==='EXPENSE').forEach(b => { pieMap[b.categoryName]=(pieMap[b.categoryName]||0)+b.amount; });
  const pieData = Object.entries(pieMap).map(([n,v])=>({name:n,value:+v.toFixed(2)}));

  if (pieData.length > 0) {
    const pieEl = document.getElementById('chart-pie');
    if (pieEl) {
      if (_chartRoots.pie) _chartRoots.pie.unmount();
      pieEl.innerHTML = '<h3 style="font-size:14px;color:var(--muted);margin-bottom:16px">支出分类占比</h3>';
      const pieDiv = document.createElement('div'); pieDiv.id = 'pie-root'; pieEl.appendChild(pieDiv);
      const pieRoot = ReactDOM.createRoot(pieDiv);
      _chartRoots.pie = pieRoot;
      pieRoot.render(
        React.createElement(Re.ResponsiveContainer, { width: '100%', height: 280 },
          React.createElement(Re.PieChart, null,
            React.createElement(Re.Pie, { data: pieData, dataKey: 'value', nameKey: 'name', cx: '50%', cy: '50%', outerRadius: 90, label: ({name,percent})=>`${name} ${(percent*100).toFixed(0)}%` },
              pieData.map((_,i) => React.createElement(Re.Cell, { key: i, fill: ['#7EC1FC','#CA3032','#04A433','#F59E0B','#8B5CF6','#EC4899','#06B6D4'][i%7] }))
            ),
            React.createElement(Re.Tooltip, { formatter: v => '¥' + v.toFixed(2) })
          )
        )
      );
    }
  }

  // Monthly line (always uses all bills for trend)
  const months = {};
  S.bills.forEach(b => {
    const m = new Date(b.date).toLocaleDateString('zh-CN',{year:'numeric',month:'short'});
    if (!months[m]) months[m] = { month: m, expense: 0, income: 0 };
    if (b.billType==='EXPENSE') months[m].expense += b.amount;
    else months[m].income += b.amount;
  });
  const lineData = Object.values(months).slice(-12);

  if (lineData.length > 0) {
    const le = document.getElementById('chart-line');
    if (le) {
      if (_chartRoots.line) _chartRoots.line.unmount();
      le.innerHTML = '<h3 style="font-size:14px;color:var(--muted);margin-bottom:16px">月度趋势</h3>';
      const ld = document.createElement('div'); ld.id = 'line-root'; le.appendChild(ld);
      const lineRoot = ReactDOM.createRoot(ld);
      _chartRoots.line = lineRoot;
      lineRoot.render(
        React.createElement(Re.ResponsiveContainer, { width: '100%', height: 280 },
          React.createElement(Re.LineChart, { data: lineData },
            React.createElement(Re.CartesianGrid, { strokeDasharray: '3 3' }),
            React.createElement(Re.XAxis, { dataKey: 'month', style: { fontSize: 11 } }),
            React.createElement(Re.YAxis, { style: { fontSize: 11 } }),
            React.createElement(Re.Tooltip, { formatter: v => '¥' + v.toFixed(2) }),
            React.createElement(Re.Legend),
            React.createElement(Re.Line, { type: 'monotone', dataKey: 'expense', stroke: '#CA3032', name: '支出', strokeWidth: 2 }),
            React.createElement(Re.Line, { type: 'monotone', dataKey: 'income', stroke: '#04A433', name: '收入', strokeWidth: 2 })
          )
        )
      );
    }
  }

  // Daily bar
  const days = chartPeriod==='week'?7:chartPeriod==='month'?30:365;
  const start = Date.now() - days*86400000;
  const barMap = {};
  for (let i=0; i<days; i++) barMap[new Date(start+i*86400000).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})] = 0;
  periodBills.filter(b=>b.billType==='EXPENSE').forEach(b => {
    const d = new Date(b.date).toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
    if (barMap[d] !== undefined) barMap[d] = (barMap[d]||0) + b.amount;
  });
  const barData = Object.entries(barMap).map(([d,a])=>({date:d,amount:+a.toFixed(2)}));

  const be = document.getElementById('chart-bar');
  if (be && barData.length > 0) {
    if (_chartRoots.bar) _chartRoots.bar.unmount();
    be.innerHTML = '<h3 style="font-size:14px;color:var(--muted);margin-bottom:16px">每日支出</h3>';
    const bd = document.createElement('div'); bd.id = 'bar-root'; be.appendChild(bd);
    const barRoot = ReactDOM.createRoot(bd);
    _chartRoots.bar = barRoot;
    barRoot.render(
      React.createElement(Re.ResponsiveContainer, { width: '100%', height: 240 },
        React.createElement(Re.BarChart, { data: barData },
          React.createElement(Re.CartesianGrid, { strokeDasharray: '3 3' }),
          React.createElement(Re.XAxis, { dataKey: 'date', style: { fontSize: 10 } }),
          React.createElement(Re.YAxis, { style: { fontSize: 11 } }),
          React.createElement(Re.Tooltip, { formatter: v => '¥' + v.toFixed(2) }),
          React.createElement(Re.Bar, { dataKey: 'amount', fill: '#CA3032', name: '支出', radius: [4,4,0,0] })
        )
      )
    );
  }
}

// ── Me (user center) ──
function renderMe(pg) {
  pg.append(h('h2', null, '我的'));

  if (!S.token) {
    pg.append(h('p', { style: 'color:var(--muted);font-size:14px;margin-bottom:16px' }, '登录后管理账号、修改密码与绑定QQ'));
    pg.appendChild(renderLogin(true));
    return;
  }

  // Account info card + QQ binding card (both filled from a single /me fetch)
  const acctBox = h('div', { className: 'card', style: 'margin-bottom:16px;font-size:13px' });
  const qqBox = h('div', { className: 'card', style: 'margin-bottom:16px' });
  pg.appendChild(acctBox);
  pg.appendChild(qqBox);
  acctBox.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px">加载中...</div>';
  qqBox.innerHTML = '';

  (async () => {
    let me = null;
    try { me = await api('/api/auth/me'); S.me = me; } catch(e) {}
    if (!me) {
      acctBox.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px">加载失败，请刷新重试</div>';
      qqBox.innerHTML = '<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px">加载失败，请刷新重试</div>';
      return;
    }
    // Account info
    acctBox.innerHTML = '';
    acctBox.appendChild(h('h3', { style: 'margin-bottom:10px' }, '账号信息'));
    const row = (label, val) => h('div', { style: 'display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light)' },
      h('span', { style: 'color:var(--muted)' }, label), h('span', { style: 'font-weight:500' }, val));
    acctBox.appendChild(row('手机号', me.phone));
    acctBox.appendChild(row('QQ号', me.qqNumber || '未绑定'));
    acctBox.appendChild(row('QQ机器人', me.qqOpenid ? ('已绑定 …' + me.qqOpenid.slice(-6)) : '未绑定'));
    if (me.createdAt) acctBox.appendChild(row('注册时间', me.createdAt.slice(0, 10)));

    // QQ binding
    qqBox.appendChild(h('h3', { style: 'margin-bottom:10px' }, 'QQ号绑定'));
    if (me.qqNumber) {
      qqBox.appendChild(h('div', { style: 'display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-light);margin-bottom:12px' },
        h('span', { style: 'color:var(--muted)' }, '已绑定 QQ号'), h('span', { style: 'font-weight:500' }, me.qqNumber)));
      qqBox.appendChild(h('button', { className: 'btn btn-outline danger', style: 'width:100%', onclick: async () => {
        if (!confirm('确定解绑QQ号？')) return;
        const r = await api('/api/auth/unbind-qq', { method: 'POST' });
        S.msg = r.message; render();
      }}, '解绑QQ号'));
    } else {
      qqBox.appendChild(h('p', { style: 'font-size:12px;color:var(--muted);margin-bottom:10px' }, '绑定QQ号后可通过QQ机器人快捷记账'));
      const qqInput = h('input', { type: 'text', placeholder: 'QQ号', style: 'margin-bottom:12px;width:100%' });
      qqBox.appendChild(qqInput);
      qqBox.appendChild(h('button', { className: 'btn btn-primary', style: 'width:100%', onclick: async () => {
        if (!qqInput.value) { S.msg = '请输入QQ号'; render(); return; }
        const r = await api('/api/auth/bind-qq', { method: 'POST', body: JSON.stringify({ qqNumber: qqInput.value }) });
        S.msg = r.message; render();
      }}, '绑定QQ'));
    }
  })();

  // Change password card (local inputs, not bound to S, to avoid focus loss)
  const pwdBox = h('div', { className: 'card', style: 'margin-bottom:16px' });
  pwdBox.appendChild(h('h3', { style: 'margin-bottom:10px' }, '修改密码'));
  const op = h('input', { type: 'password', placeholder: '原密码', style: 'margin-bottom:12px;width:100%' });
  const np = h('input', { type: 'password', placeholder: '新密码(至少6位)', style: 'margin-bottom:12px;width:100%' });
  pwdBox.appendChild(op); pwdBox.appendChild(np);
  pwdBox.appendChild(h('button', { className: 'btn btn-primary', style: 'width:100%', onclick: async () => {
    const r = await api('/api/auth/password', { method: 'POST', body: JSON.stringify({ oldPassword: op.value, newPassword: np.value }) });
    S.msg = r.message || (r.oldPassword ? '原密码错误' : '修改失败');
    op.value = ''; np.value = '';
    if (S.me && r && r.message && !/失败|错误|密码/.test(r.message)) { try { S.me = await api('/api/auth/me'); } catch(e){} }
    render();
  }}, '修改密码'));
  pg.appendChild(pwdBox);

  // Logout (consolidated here; clears all cached state)
  pg.appendChild(h('button', { className: 'btn btn-outline danger', style: 'width:100%', onclick: () => {
    if (!confirm('退出将清除本地缓存数据')) return;
    localStorage.removeItem('rkl_token'); localStorage.removeItem('rkl_theme');
    S.token = null; S.user = null; S.me = null;
    S.bills = []; S.cats = []; S.accts = []; S.keywords = [];
    S.qq = ''; S.phone = ''; S.pwd = ''; S.lastSync = 0;
    S.botConfigured = false; S.botBound = false; S.botOpenid = ''; S.botMaskedId = '';
    S.tab = 'me'; render();
  }}, '退出登录'));

  if (S.msg) pg.appendChild(h('p', { className: msgClass() }, S.msg));
}

      if(!kwInput.value||!kwCat.value){S.msg='请填写完整';render();return;}
      const r=await api('/api/keywords',{method:'POST',body:JSON.stringify({keyword:kwInput.value,categoryName:kwCat.value})});
      S.msg=r.id?'关键词已保存':(r.message||'失败');
      await loadKeywords();
      render();
    }},'添加'));
    kwCard.appendChild(kwGrid);

    // List existing keywords
    const kwList = h('div',{style:'max-height:200px;overflow:auto'});
    if (!S.keywords || S.keywords.length === 0) {
      kwList.appendChild(h('p',{style:'color:var(--muted);font-size:13px;padding:12px 0;text-align:center'},
        '暂无自定义关键词，添加关键词可实现智能分类匹配'));
    } else {
      S.keywords.forEach(kw=>{
        const row = h('div',{style:'display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)'});
        row.append(h('span',{style:'flex:1;font-size:13px'},kw.keyword+' → '+kw.categoryName));
        row.append(h('span',{style:'font-size:11px;color:var(--muted)'},'优先级:'+kw.priority));
        row.append(h('button',{className:'btn btn-outline',style:'padding:4px 10px;font-size:11px;color:var(--expense);border-color:var(--expense)',onclick:async()=>{
          await api('/api/keywords/'+kw.id,{method:'DELETE'});
          await loadKeywords();
          render();
        }},'删除'));
        kwList.appendChild(row);
      });
    }
    kwCard.appendChild(kwList);
    pg.appendChild(kwCard);

    // Template Management
    pg.append(h('h3',{style:'margin-top:24px;margin-bottom:12px'},'记账模板'));
    const tmplBox = h('div',{className:'card',style:'margin-bottom:16px'});
    pg.appendChild(tmplBox);
    renderTemplateSection(tmplBox);

    // Suggest Config
    pg.append(h('h3',{style:'margin-top:24px;margin-bottom:12px'},'智能推荐'));
    const cfgBox = h('div',{className:'card',style:'margin-bottom:16px'});
    pg.appendChild(cfgBox);
    renderSuggestConfig(cfgBox);

    // Budget Management
    pg.append(h('h3',{style:'margin-top:24px;margin-bottom:12px'},'月度预算'));
    const budgetBox = h('div',{className:'card',style:'margin-bottom:16px'});
    pg.appendChild(budgetBox);
    renderBudgetSection(budgetBox);

    if (S.msg) pg.append(h('p',{className:msgClass()},S.msg));
    return;
  }

  pg.append(h('p', { style: 'color:var(--muted);font-size:14px;margin-bottom:16px;text-align:center' },
    '请登录后使用记账、账单管理、图表分析和资产管理功能'));
  pg.appendChild(renderLogin(true));
}

// ── Bot Settings Section ──
function renderBotSection(box) {
  box.className = 'card bot-card';

  // ── Status ──
  const statusSec = h('div',{className:'section'});
  const statusRow = h('div',{style:'display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500'});
  const dot = h('span',{className:'status-dot ' + (S.botConfigured ? 'on' : 'off')});
  statusRow.append(dot, S.botConfigured ? ('QQ 机器人已配置 · '+S.botMaskedId) : 'QQ 机器人未配置');
  statusSec.appendChild(statusRow);
  if (!S.botConfigured) {
    statusSec.appendChild(h('p',{className:'hint'},'请在下方填入从 QQ 开放平台获取的凭证'));
  }
  box.appendChild(statusSec);

  // ── Credentials Form ──
  const credSec = h('div',{className:'section'});
  credSec.appendChild(h('div',{className:'section-label'},'机器人凭证'));

  // AppID field
  credSec.appendChild(h('div',{className:'field-row'},
    h('label',null,'AppID'),
    h('input',{type:'text',placeholder:'从 q.qq.com 获取',value:S.botAppId,oninput:e=>S.botAppId=e.target.value})
  ));

  // ClientSecret field with toggle
  const secRow = h('div',{className:'field-row'});
  secRow.appendChild(h('label',null,'Secret'));
  secRow.appendChild(h('input',{type:S.botShowSecret?'text':'password',placeholder:'从 q.qq.com 获取',value:S.botSecret,oninput:e=>S.botSecret=e.target.value,style:'flex:1'}));
  secRow.appendChild(h('button',{className:'toggle-vis',onclick:()=>{S.botShowSecret=!S.botShowSecret;render();},title:'显示/隐藏'},
    S.botShowSecret ? '🙈' : '👁'));
  credSec.appendChild(secRow);

  // Save button
  const saveRow = h('div',{style:'margin-top:4px'});
  saveRow.appendChild(h('button',{className:'btn btn-primary',style:'font-size:13px;padding:8px 20px',
    onclick:async()=>{
      if(!S.botAppId||!S.botSecret){S.msg='请填写 AppID 和 ClientSecret';render();return;}
      const r=await api('/api/qq-bot/config',{method:'POST',body:JSON.stringify({appId:S.botAppId,clientSecret:S.botSecret})});
      S.msg=r.message;
      if(!r.message.includes('失败')){
        S.botAppId='';S.botSecret='';S.botShowSecret=false;
        // Reload status
        try{const st=await api('/api/qq-bot/status');S.botConfigured=st.configured==='true';S.botMaskedId=st.maskedAppId||'';}catch(e){}
      }
      render();
    }
  },'保存配置'));
  credSec.appendChild(saveRow);

  box.appendChild(credSec);

  // ── Account Binding ──
  if (S.botConfigured) {
    const bindSec = h('div',{className:'section'});
    bindSec.appendChild(h('div',{className:'section-label'},'账号绑定'));

    if (S.botBound) {
      const bindRow = h('div',{style:'display:flex;align-items:center;gap:8px'});
      bindRow.appendChild(h('span',{style:'font-size:13px;color:var(--income);font-weight:500'},'已绑定'));
      bindRow.appendChild(h('code',{style:'font-size:12px;color:var(--muted);background:var(--border-light);padding:2px 8px;border-radius:4px'},'...'+S.botOpenid));
      bindRow.appendChild(h('button',{className:'btn btn-outline danger',style:'padding:4px 12px;font-size:11px;margin-left:auto',
        onclick:async()=>{
          const r=await api('/api/qq-bot/unbind',{method:'POST'});
          S.msg=r.message;render();
        }
      },'解绑'));
      bindSec.appendChild(bindRow);
    } else {
      bindSec.appendChild(h('p',{className:'hint',style:'marginBottom:8px'},'向 QQ 机器人发送任意消息获取 6 位绑定码'));
      const codeRow = h('div',{style:'display:flex;gap:8px'});
      codeRow.appendChild(h('input',{type:'text',placeholder:'绑定码 (如: 123456)',value:S.bindCode,oninput:e=>S.bindCode=e.target.value,style:'flex:1;font-size:13px;padding:8px 12px'}));
      codeRow.appendChild(h('button',{className:'btn btn-primary',style:'padding:8px 16px;font-size:13px;flex-shrink:0',
        onclick:async()=>{
          if(!S.bindCode){S.msg='请输入绑定码';render();return;}
          const r=await api('/api/qq-bot/bind',{method:'POST',body:JSON.stringify({code:S.bindCode})});
          S.msg=r.message;S.bindCode='';
          try{const bs=await api('/api/qq-bot/bind-status');S.botBound=bs.bound==='true';S.botOpenid=bs.openid||'';}catch(e){}
          render();
        }
      },'绑定'));
      bindSec.appendChild(codeRow);
    }
    box.appendChild(bindSec);
  }

  // ── Setup Guide ──
  const guide = h('details',{style:'borderTop:1px solid var(--border-light);paddingTop:12px'});
  guide.appendChild(h('summary',null,'接入说明'));
  guide.appendChild(h('ol',null,
    h('li',null,'在 q.qq.com 创建机器人，获取 AppID 和 ClientSecret'),
    h('li',null,'在此页面填入凭证并保存'),
    h('li',null,'在 QQ 开放平台「开发设置」中配置 Webhook URL: '+location.origin+'/api/qq/bot/webhook'),
    h('li',null,'向机器人发送任意消息获取绑定码，在此绑定账号')
  ));
  box.appendChild(guide);
}

// ── Template & Suggest Config ──
function renderTemplateSection(box) {
  box.innerHTML = '<div class="field-row" style="margin-bottom:8px">'+
    '<input type="text" placeholder="标签(如:早餐)" id="tmpl_label" style="width:100px;font-size:12px;padding:6px 8px">'+
    '<input type="number" step="0.01" placeholder="金额" id="tmpl_amount" style="width:70px;font-size:12px;padding:6px 8px">'+
    '<select id="tmpl_cat" style="width:100px;font-size:12px;padding:6px 4px"><option value="">分类</option></select>'+
    '<select id="tmpl_acct" style="width:100px;font-size:12px;padding:6px 4px"><option value="">账户</option></select>'+
    '<button class="btn btn-primary" style="font-size:12px;padding:6px 12px" id="tmpl_add_btn">添加</button></div>'+
    '<div id="tmpl_list" style="max-height:200px;overflow:auto"></div>';

  // Populate selects
  const catSel = box.querySelector('#tmpl_cat');
  S.cats.forEach(c => catSel.appendChild(h('option',{value:c.id+'||'+c.name},c.name)));
  const acctSel = box.querySelector('#tmpl_acct');
  S.accts.forEach(a => acctSel.appendChild(h('option',{value:a.id},a.name)));

  box.querySelector('#tmpl_add_btn').onclick = async () => {
    const catVal = (catSel.value||'').split('||');
    if(!catVal[0]||!acctSel.value){S.msg='请选择分类和账户';render();return;}
    await api('/api/templates',{method:'POST',body:JSON.stringify({
      label:box.querySelector('#tmpl_label').value||'未命名',
      amount:parseFloat(box.querySelector('#tmpl_amount').value||'0'),
      categoryId:parseInt(catVal[0]),categoryName:catVal[1]||'',
      accountId:parseInt(acctSel.value),sortOrder:0
    })});
    render(); // re-render to refresh template list
  };

  // Load list
  (async()=>{
    try {
      const tms = await api('/api/templates');
      const list = box.querySelector('#tmpl_list');
      list.innerHTML = '';
      if(!tms.length) list.appendChild(h('p',{style:'color:var(--muted);font-size:12px'},'暂无模板'));
      else tms.forEach(t => {
        const row = h('div',{style:'display:flex;align-items:center;gap:4px;padding:4px 0;border-bottom:1px solid var(--border-light)'});
        row.appendChild(h('span',{style:'flex:1;font-size:12px'},t.label+' ¥'+t.amount+' → '+t.categoryName));
        row.appendChild(h('button',{className:'btn btn-outline',style:'padding:2px 6px;font-size:10px',
          onclick:async()=>{await api('/api/templates/'+t.id,{method:'DELETE'});render();}
        },'删'));
        list.appendChild(row);
      });
    }catch(e){
      const list = box.querySelector('#tmpl_list');
      if(list) list.append(h('p',{style:'color:var(--expense);font-size:12px'},'加载失败，请稍后重试'));
    }
  })();
}

function renderSuggestConfig(box) {
  box.innerHTML = '<div style="font-size:13px;color:var(--muted)">加载中...</div>';
  (async()=>{
    try {
      let c = await api('/api/insights/suggest-config');
      if(!c||c.enabled===undefined){c={enabled:true,lookbackDays:7,minOccurrences:3,displayDuration:5000};}
      box.innerHTML = '';
      const save = async()=>{await api('/api/insights/suggest-config',{method:'PUT',body:JSON.stringify(c)});};
      // toggle
      const tgl = h('label',{style:'display:flex;align-items:center;gap:8px;margin-bottom:12px'});
      const cb = h('input',{type:'checkbox'});cb.checked=c.enabled;
      cb.onchange = ()=>{c.enabled=cb.checked;save();};
      tgl.appendChild(cb);tgl.appendChild(h('span',null,'启用智能推荐'));box.appendChild(tgl);
      // sliders
      [{k:'lookbackDays',l:'回溯天数',min:3,max:30},{k:'minOccurrences',l:'最少出现次数',min:1,max:20},
       {k:'displayDuration',l:'显示时长(秒)',min:2,max:30}].forEach(f=>{
        const r = h('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:8px'});
        r.appendChild(h('span',{style:'font-size:12px;width:110px'},f.l));
        const inp = h('input',{type:'range',min:f.min,max:f.max,value:c[f.k]||f.min,style:'flex:1'});
        const lbl = h('span',{style:'font-size:12px;width:30px;text-align:right'},c[f.k]||f.min);
        inp.oninput = ()=>{c[f.k]=parseInt(inp.value);lbl.textContent=inp.value;save();};
        r.appendChild(inp);r.appendChild(lbl);
        box.appendChild(r);
      });
    }catch(e){box.innerHTML='<div style="font-size:13px;color:var(--expense)">加载失败，请稍后重试</div>';}
  })();
}

// ── Budget Section (月度预算) ──
function renderBudgetSection(box) {
  box.innerHTML = '<div style="font-size:13px;color:var(--muted)">加载中...</div>';
  const d = new Date();
  const monthStart = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  const nextMonth = new Date(d.getFullYear(), d.getMonth()+1, 1).getTime();

  (async () => {
    try {
      // Refresh bills so month expense is current (skip if already loaded)
      if (S.bills.length === 0) {
        const bRes = await api('/api/bills/sync');
        if (bRes.bills) S.bills = bRes.bills.reverse();
      }

      const budgets = await api('/api/budgets');
      const cur = (Array.isArray(budgets) ? budgets : []).find(b => b.monthStart === monthStart && !b.deleted);
      const expense = S.bills
        .filter(b => b.billType === 'EXPENSE' && b.date >= monthStart && b.date < nextMonth)
        .reduce((s, b) => s + (b.amount || 0), 0);

      box.innerHTML = '';
      box.appendChild(h('div', { style:'display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px' },
        h('span', { style:'font-size:13px;font-weight:600' }, (d.getFullYear())+'年'+(d.getMonth()+1)+'月'),
        cur ? h('span', { style:'font-size:11px;color:var(--muted)' }, '预算 ¥'+cur.amount.toFixed(2)) : null));

      // Month expense summary
      const sum = h('div', { className:'summary-card', style:'margin:6px 0 12px' });
      sum.appendChild(h('div', { className:'label' }, '本月支出'));
      const expVal = h('span', { className:'budget-num' });
      sum.appendChild(h('div', { className:'val', style:'color:'+(cur && expense > cur.amount ? 'var(--expense)' : 'var(--text)') }, expVal));
      countUp(expVal, expense, 'budget:exp', v => '¥'+v.toFixed(2));
      box.appendChild(sum);

      if (cur && cur.amount > 0) {
        const pct = Math.min(100, Math.round(expense / cur.amount * 100));
        const bar = h('div', { className:'budget-bar' + (expense > cur.amount ? ' over' : '') });
        bar.appendChild(h('div', { style:'width:'+pct+'%' }));
        box.appendChild(bar);
        box.appendChild(h('div', { style:'display:flex;justify-content:space-between;font-size:12px;color:var(--muted)' },
          h('span', null, '已用 '+pct+'%'),
          h('span', null, '本月剩余 '+Math.max(0, cur.amount - expense).toFixed(2))));
        if (expense > cur.amount) {
          box.appendChild(h('div', { style:'font-size:13px;font-weight:600;color:var(--expense);margin-top:8px' },
            '已超预算 ¥'+(expense - cur.amount).toFixed(2)));
        }
      } else {
        box.appendChild(h('p', { style:'font-size:12px;color:var(--muted);margin-bottom:10px' }, '尚未设置本月预算，设置后可查看进度'));
      }

      // Edit row
      const row = h('div', { style:'display:flex;align-items:center;gap:8px;margin-top:12px' });
      const inp = h('input', { type:'number', step:'0.01', min:'0', placeholder:'设置预算金额', style:'flex:1' });
      row.appendChild(inp);
      row.appendChild(h('button', { className:'btn btn-primary', style:'padding:8px 16px;font-size:13px', onclick: async () => {
        const amount = parseFloat(inp.value);
        if (!(amount > 0)) { S.msg = '请输入正确的预算金额'; render(); return; }
        await api('/api/budgets', { method:'PUT', body: JSON.stringify({ monthStart: monthStart, amount: amount }) });
        S.msg = '预算已保存'; render();
      }}, '保存'));
      box.appendChild(row);
    } catch (e) { box.innerHTML = '<div style="font-size:13px;color:var(--expense)">加载失败，请稍后重试</div>'; }
  })();
}

// ── Helpers ──
function fmtDate(ts) { return new Date(ts).toLocaleDateString('zh-CN',{month:'short',day:'numeric'}); }

// Number count-up with cubic-out easing. Guarded by key so full-page re-renders
// (e.g. typing in the search filter) don't replay the animation when the value
// hasn't changed.
const _countupLast = {};
function countUp(el, target, key, fmt, dur=400) {
  if (key && _countupLast[key] === target) { el.textContent = fmt(target); return; }
  if (key) _countupLast[key] = target;
  const start = performance.now();
  (function frame(now){
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmt(target * eased);
    if (t < 1) requestAnimationFrame(frame);
  })(performance.now());
}

async function loadData() {
  // Load categories & accounts first (public, no auth needed), then bills (needs valid JWT)
  // If bills sync fails, categories & accounts still load so the UI works
  try {
    const [cRes, aRes] = await Promise.all([
      api('/api/bills/categories'), api('/api/bills/accounts')
    ]);
    if (Array.isArray(cRes)) S.cats = cRes;
    if (Array.isArray(aRes)) S.accts = aRes;
  } catch(e) { console.error('Failed to load categories/accounts:', e); }

  if (S.token) {
    try {
      const bRes = await api('/api/bills/sync');
      if (bRes.bills) S.bills = bRes.bills.reverse();
      S.lastSync = Date.now();
    } catch(e) { console.error('Failed to sync bills:', e); }
    await loadKeywords();
  }
  render();
}

async function loadKeywords() {
  if (!S.token) return;
  try {
    const r = await api('/api/keywords');
    if (Array.isArray(r)) S.keywords = r;
  } catch(e) { console.error(e); }
}

// ── Init ──
async function init() {
  applyTheme();
  if (S.token) await loadData();
  render();
}
init();
