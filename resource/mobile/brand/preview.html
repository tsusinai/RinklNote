<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>记一笔 · 收支页签</title>
<style>*{box-sizing:border-box}body{margin:0;padding:48px;background:#f5f7fa;color:#303840;font:16px system-ui}h1{font-size:30px;margin:0 0 8px}p{color:#6b7480}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border-radius:24px;padding:32px;background:white;min-height:230px}.mark{width:112px;height:112px;display:block;margin:16px auto 24px}.dark{background:#26333e;color:white}.sizes{display:flex;align-items:center;gap:24px;height:130px}.sizes img{width:var(--size);height:var(--size)}.launcher{border-radius:18px;background:#f5f7fa;padding:24px;display:flex;align-items:center;gap:16px}.launcher img{width:64px}.row{display:flex;gap:16px;align-items:center}.row img{width:32px}h2{font-size:18px;margin:0 0 20px}.muted{font-size:14px;color:#788390}.color{height:32px;border-radius:8px;margin-bottom:12px}</style>
<h1>记一笔 · 收支页签</h1><p>纯几何标识 · 蓝色识别 · 无阴影 · 无字体依赖</p>
<main><section class="card"><h2>蓝色标识</h2><img class="mark" src="symbol-blue.svg"><p class="muted">浅色背景 · #5AA8E8</p></section><section class="card"><h2>单色标识</h2><img class="mark" src="symbol-black.svg"><p class="muted">打印 / 单色 / 形状检查</p></section><section class="card dark"><h2>反白标识</h2><img class="mark" src="symbol-white.svg"><p>深色背景</p></section><section class="card"><h2>小尺寸检查</h2><div class="sizes"><img style="--size:16px" src="symbol-blue.svg"><img style="--size:24px" src="symbol-blue.svg"><img style="--size:32px" src="symbol-blue.svg"><img style="--size:64px" src="symbol-blue.svg"></div><p class="muted">16 / 24 / 32 / 64 px</p></section><section class="card"><h2>启动与应用内</h2><div class="launcher"><img src="app-icon.svg"><span>记一笔<br><small class="muted">RinklNote</small></span></div><p class="row"><img src="symbol-blue.svg">灵动滑块 / 登录标识</p></section><section class="card"><h2>保留品牌蓝</h2><div class="color" style="background:#7ec1fc"></div><p class="muted">#7EC1FC · 启动背景</p><div class="color" style="background:#5aa8e8"></div><p class="muted">#5AA8E8 · 浅背景标识</p></section></main></html>
