ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [com.example.rinklnote.server.ApplicationKt.module]
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/rinklnote"
    url = ${?DATABASE_URL}
    user = "rinklnote"
    user = ${?DATABASE_USER}
    password = "rinklnote"
    password = ${?DATABASE_PASSWORD}
}

jwt {
    secret = "change-me-in-production-use-random-256-bit-key"
    secret = ${?JWT_SECRET}
    issuer = "rinklnote-server"
    audience = "rinklnote-app"
}

webhook {
    secret = "change-me-webhook-secret"
    secret = ${?WEBHOOK_SECRET}
}

deepseek {
    apiKey = ""
    apiKey = ${?DEEPSEEK_API_KEY}
    baseUrl = "https://api.deepseek.com"
    baseUrl = ${?DEEPSEEK_BASE_URL}
    model = "deepseek-chat"
    model = ${?DEEPSEEK_MODEL}
    timeoutMs = 10000
    timeoutMs = ${?LLM_TIMEOUT_MS}
}

learning {
    intervalMin = 60
    intervalMin = ${?LEARNING_INTERVAL_MIN}
}

anomaly {
    threshold = 1.5
    threshold = ${?ANOMALY_THRESHOLD}
}
